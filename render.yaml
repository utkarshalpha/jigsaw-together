# One-click deploy on Render's free tier. Websockets work there out of the box.
#
# Render → New → Blueprint → point it at this repo. Everything below is read
# automatically; nothing needs configuring in the dashboard.
services:
  - type: web
    # Must match the service name in the Render dashboard. Blueprints bind to
    # services BY NAME, so if these drift apart the next sync creates a second
    # service instead of updating this one.
    name: playjigsaw
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render terminates TLS at its own proxy, so every player reaches the app
      # from that proxy's address. Without this the per-IP rate limits would
      # count the whole site as one client and throttle everyone together. The
      # app only trusts X-Forwarded-For from a local hop unless told otherwise,
      # which is why this has to be set explicitly here.
      - key: TRUST_PROXY
        value: "1"
